name: Build RealisticVillagers (Paper 26.2)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giai nen source
        run: |
          rm -rf proj && mkdir proj
          unzip -q -o RealisticVillagers-26.2-source.zip -d proj

      - name: Va dependency (ConfigUpdater, EliteMobs, packetevents)
        run: |
          cat > patch.py <<'PYEOF'
          import re, pathlib
          p = pathlib.Path("proj/core/pom.xml")
          s = p.read_text()

          # 1) packetevents: dung ban release
          s = s.replace("<version>2.9.5-SNAPSHOT</version>", "<version>2.9.5</version>")

          # 2) ConfigUpdater: snapshot da mat -> dung ban 2.2 tren Maven Central
          s = s.replace("<artifactId>ConfigUpdater</artifactId>\n            <version>2.0-SNAPSHOT</version>",
                        "<artifactId>ConfigUpdater</artifactId>\n            <version>2.2</version>")

          # 3) EliteMobs: bo dependency (snapshot da mat), EMCompatibility se dung reflection
          s, n = re.subn(r"\s*<!-- EliteMobs -->\s*<dependency>.*?</dependency>", "", s, flags=re.S)
          assert n == 1, "khong tim thay EliteMobs"
          p.write_text(s)

          em = pathlib.Path("proj/core/src/main/java/me/matsubara/realisticvillagers/compatibility/EMCompatibility.java")
          em.write_text('''package me.matsubara.realisticvillagers.compatibility;

          import org.bukkit.Bukkit;
          import org.bukkit.entity.Villager;
          import org.bukkit.plugin.Plugin;

          import java.lang.reflect.Method;
          import java.util.ArrayList;
          import java.util.List;

          // Dung reflection de khong can EliteMobs luc compile.
          public class EMCompatibility implements Compatibility {

              private static final String[] NAMES = {"isNPC", "isEliteProjectile", "isEliteEntity", "isSuperMob", "isVisualEffect"};

              private List<Method> methods;
              private boolean failed;

              @Override
              public boolean shouldTrack(Villager villager) {
                  if (failed) return true;
                  try {
                      if (methods == null) {
                          Plugin plugin = Bukkit.getPluginManager().getPlugin("EliteMobs");
                          if (plugin == null) {
                              failed = true;
                              return true;
                          }
                          Class<?> clazz = Class.forName("com.magmaguy.elitemobs.tagger.PersistentTagger", true, plugin.getClass().getClassLoader());
                          List<Method> found = new ArrayList<>();
                          for (String name : NAMES) {
                              try {
                                  found.add(clazz.getMethod(name, org.bukkit.entity.Entity.class));
                              } catch (NoSuchMethodException ignored) {
                              }
                          }
                          methods = found;
                      }
                      for (Method method : methods) {
                          if ((boolean) method.invoke(null, villager)) return false;
                      }
                      return true;
                  } catch (Throwable throwable) {
                      failed = true;
                      return true;
                  }
              }
          }
          ''')

          # 4) Paper/MC 26.2: FarmBlock doi ten thanh FarmlandBlock
          hf = pathlib.Path("proj/v26_2/src/main/java/me/matsubara/realisticvillagers/entity/v26_2/villager/ai/behaviour/work/HarvestFarmland.java")
          t = hf.read_text()
          t = re.sub(r"\bFarmBlock\b", "FarmlandBlock", t)
          hf.write_text(t)

          # 5) Villager.ReputationEvent khong con trong API 26.2 -> bo 3 ham override (vo hieu hoa, khong anh huong logic plugin)
          gc = pathlib.Path("proj/v26_2/src/main/java/me/matsubara/realisticvillagers/nms/v26_2/CustomGossipContainer.java")
          g = gc.read_text()
          g, n = re.subn(r"    @Override\n    public void remove\([^)]*Villager\.ReputationEvent event\) \{\n[^\n]*\n    \}\n\n?", "", g)
          assert n == 3, n
          g = g.replace("import org.bukkit.entity.Villager;\n", "")
          gc.write_text(g)
          PYEOF
          python3 patch.py
          grep -n -A3 "ConfigUpdater\|packetevents-spigot" proj/core/pom.xml

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build core (Maven)
        working-directory: proj
        run: mvn -B -ntp -U -pl core -am clean package -DskipTests

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Va loi 26.2 (quyen truy cap, am thanh meo, PetCat, hien du loi)
        run: |
          cat > patch2.py <<'PYEOF2'
          import re, pathlib
          base = pathlib.Path("proj/v26_2/src/main/java/me/matsubara/realisticvillagers")

          # A) Paper 26.2: cac ham am thanh trong Villager/WanderingTrader da la public -> mo rong quyen truy cap (luon hop le)
          for f in ["entity/v26_2/WanderingTraderNPC.java", "entity/v26_2/villager/VillagerNPC.java"]:
              p = base / f
              s = p.read_text()
              s = re.sub(r"protected (@Nullable )?(SoundEvent (?:getAmbientSound|getHurtSound|getDeathSound|getTradeUpdatedSound)\()", r"public \1\2", s)
              p.write_text(s)

          # B) PetCat: Cat da co setRelaxStateOne/isRelaxStateOne public -> xoa ban private + field reflection
          p = base / "entity/v26_2/pet/PetCat.java"
          s = p.read_text()
          s = re.sub(r"[^\n]*private static final EntityDataAccessor<Boolean> RELAX_STATE_ONE[^\n]*\n", "", s)
          s, n = re.subn(r"    private void setRelaxStateOne\(boolean flag\) \{\n[^\n]*\n    \}\n\n", "", s)
          assert n == 1, "setRelaxStateOne"
          s, n = re.subn(r"    private boolean isRelaxStateOne\(\) \{\n[^\n]*\n    \}\n\n", "", s)
          assert n == 1, "isRelaxStateOne"
          # C) SoundEvents.CAT_* da bi bo (am thanh meo gio la variant) -> phat bang ten am thanh (Bukkit)
          s = s.replace("playSound(SoundEvents.CAT_EAT, 1.0f, 1.0f);",
            'getBukkitEntity().getWorld().playSound(getBukkitEntity().getLocation(), "entity.cat.eat", org.bukkit.SoundCategory.NEUTRAL, 1.0f, 1.0f);')
          s = s.replace("playSound(SoundEvents.CAT_BEG_FOR_FOOD, 1.0f, 1.0f);",
            'getBukkitEntity().getWorld().playSound(getBukkitEntity().getLocation(), "entity.cat.beg_for_food", org.bukkit.SoundCategory.NEUTRAL, 1.0f, 1.0f);')
          p.write_text(s)

          p = base / "entity/v26_2/villager/ai/behaviour/core/TameOrFeedPet.java"
          s = p.read_text()
          s = s.replace("tamable.playSound(SoundEvents.CAT_EAT, 1.0f, 1.0f);",
            'tamable.getBukkitEntity().getWorld().playSound(tamable.getBukkitEntity().getLocation(), "entity.cat.eat", org.bukkit.SoundCategory.NEUTRAL, 1.0f, 1.0f);')
          p.write_text(s)

          # D) Hien thi toi da 2000 loi thay vi 100
          g = pathlib.Path("proj/build.gradle.kts")
          t = g.read_text()
          t = t.replace('options.encoding = "UTF-8"', 'options.encoding = "UTF-8"\n    options.compilerArgs.add("-Xmaxerrs")\n    options.compilerArgs.add("2000")')
          g.write_text(t)
          PYEOF2
          python3 patch2.py

      - name: Build plugin 26.2 (Gradle)
        working-directory: proj
        shell: bash
        run: gradle --no-daemon --stacktrace jar 2>&1 | tee gradle-build.log

      - name: Tom tat loi + dump API (chi chay khi loi)
        if: failure()
        working-directory: proj
        shell: bash
        run: |
          {
            echo '## Loi bien dich (da loc trung)'
            echo '```'
            grep -E "error:" gradle-build.log | sed -E 's#.*/realisticvillagers/##' | sort -u | head -400
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          JAR=""
          for j in $(find ~/.gradle ~/.m2 "$PWD/.gradle" -name '*.jar' 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/world/entity/EntityType.class'; then JAR="$j"; break; fi
          done
          {
            echo '## API 26.2 (javap)'
            echo "jar: $JAR"
            if [ -n "$JAR" ]; then
              echo '### EntityType (villager/trader)'
              javap -p -cp "$JAR" net.minecraft.world.entity.EntityType | grep -iE "villager|trader" || true
              echo '### SoundEvents (cat)'
              javap -p -cp "$JAR" net.minecraft.sounds.SoundEvents | grep -i "cat_" || true
              echo '### Class Villager / WanderingTrader / Cat'
              unzip -l "$JAR" | grep -iE "/(Villager|WanderingTrader|Cat|AbstractVillager)\.class" || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: RealisticVillagers-paper-26.2
          path: proj/build/libs/RealisticVillagers-*.jar
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: proj/gradle-build.log
