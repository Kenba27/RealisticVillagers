name: Build RealisticVillagers (Paper 26.2)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Giai nen source
        run: |
          rm -rf proj && mkdir proj
          unzip -q -o RealisticVillagers-26.2-source.zip -d proj
          # Vá packetevents: bản SNAPSHOT trên jitpack bị 401 -> dùng bản release trên codemc.
          sed -i 's#<version>2.9.5-SNAPSHOT</version>#<version>2.9.5</version>#' proj/core/pom.xml
          sed -i '0,/<repositories>/s#<repositories>#<repositories>\n        <repository>\n            <id>codemc-snapshots</id>\n            <url>https://repo.codemc.io/repository/maven-snapshots/</url>\n        </repository>#' proj/core/pom.xml
          grep -n -B2 -A2 "packetevents\|codemc-snapshots" proj/core/pom.xml

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build core (Maven)
        working-directory: proj
        run: mvn -B -ntp -pl core -am clean package -DskipTests

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build plugin 26.2 (Gradle)
        working-directory: proj
        shell: bash
        run: gradle --no-daemon --stacktrace jar 2>&1 | tee gradle-build.log

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: RealisticVillagers-paper-26.2
          path: proj/build/libs/RealisticVillagers-*.jar
          if-no-files-found: error

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: proj/gradle-build.loga
